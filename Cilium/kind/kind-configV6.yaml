apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: kind
nodes:
  - role: control-plane
    image: "kindest/node:v1.35.1"
    extraPortMappings:
    - containerPort: 2345
      hostPort: 23401
      protocol: TCP
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "bgp=controlplane"
  - role: worker
    image: "kindest/node:v1.35.1"
    extraPortMappings:
    - containerPort: 2345
      hostPort: 23411
      protocol: TCP
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "bgp=65001"
  - role: worker
    image: "kindest/node:v1.35.1"
    extraPortMappings:
    - containerPort: 2345
      hostPort: 23412
      protocol: TCP
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "bgp=65001"
networking:
  ipFamily: ipv6
  apiServerPort: 6443
  podSubnet: "2001:db8:10::/48"
  serviceSubnet: "2001:db8:10:96::/112"
  disableDefaultCNI: true
  kubeProxyMode: none
