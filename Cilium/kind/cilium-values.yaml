debug:
  enabled: false
  verbose: flow kvstore envoy datapath policy

#image:
# repository: localhost:5000/cilium/cilium-dev
# tag: local
# pullPolicy: IfNotPresent

healthChecking: true

endpointHealthChecking:
  # -- Enable connectivity health checking between virtual endpoints.
  enabled: false

sessionAffinity: true

ciliumEndpointSlice:
  enable: true

cluster:
  name: kind
  id: 1

ipv4:
  enabled: true
enableIPv4BIGTCP: true
enableIPv6BIGTCP: false

enableIPv4Masquerade: true
enableIPv6Masquerade: false
ipMasqAgent:
  enabled: false

ipv6:
  enabled: false

kubeProxyReplacement: "true"
# cluster name is test
k8sServiceHost: kind-control-plane
#k8sServiceHost: 192.168.142.130
k8sServicePort: 6443

routingMode: "native"
# -- Allows to explicitly specify the IPv4 CIDR for native routing.
ipv4NativeRoutingCIDR: "10.1.0.0/16"
autoDirectNodeRoutes: true
enableCiliumEndpointSlice: false
endpointRoutes:
  enabled: false

installNoConntrackIptablesRules: true
bpf:
  masquerade: true
  enableTCX: true
  datapathMode: netkit
  tproxy: false

ipam:
  mode: "cluster-pool"
  #mode: "kubernetes"

  operator:
     # -- IPv4 CIDR list range to delegate to individual nodes for IPAM.
    clusterPoolIPv4PodCIDRList: ["10.1.0.0/16"]
    # -- IPv4 CIDR mask size to delegate to individual nodes for IPAM.
    clusterPoolIPv4MaskSize: 26

nodePort:
  enabled: true

bgpControlPlane:
  enabled: true

operator:
  replicas: 1

  prometheus:
    enabled: true

annotateK8sNode: true

sleepAfterInit: false


# -- Enable Layer 7 network policy.
l7Proxy: true

envoyConfig:
  enabled: true

# XDP driver/native mode, 
# acceleration: disabled used for bare-mental setup.
# acceleration: native  used for Kind setup.
loadBalancer:
  algorithm: maglev
  # acceleration: disabled
  acceleration: native
  mode: dsr
  l7:
    backend: envoy

resources: 
  limits:
    cpu: 3000m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 256Mi

annotateK8sNode: false

# -- Enable Local Redirect Policy.
localRedirectPolicy: true


clustermesh:
  useAPIServer: false

  config:
    enabled: false

    clusters:
    - name: cluster2
      port: 2379
      ips:
      - 120.18.255.201

  apiserver:
    kvstoremesh:
      enabled: true

hubble:
  enabled: true

  metrics:
    enabled:
    - dns:query;ignoreAAAA
    - drop
    - tcp
    - flow
    - icmp
    - http

  relay:
    enabled: true

  ui:
    enabled: true

hostFirewall:
  # -- Enables the enforcement of host policies in the eBPF datapath.
  enabled: false
